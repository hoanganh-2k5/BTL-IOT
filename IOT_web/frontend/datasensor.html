<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="stylesheet" href="./css/table.css">

    <title>Data Sensor</title>
</head>

<body class="table-view">

    <div class="wrap-all">

        <!-- ================= SIDEBAR ================= -->
        <aside id="sidebar">

            <header class="header-sidebar">
                <span class="logo-mark">◉</span>
                <span>Sensor monitor</span>
            </header>

            <nav class="nav-content">
                <button class="nav-btn">▦ Dashboard</button>
                <button class="nav-btn active">▥ Data Sensor</button>
                <button class="nav-btn">↻ Action History</button>
                <button class="nav-btn">▯ Profile</button>
            </nav>

            <footer class="footer-sidebar">
                <div class="user-small">
                    <div class="avatar">A</div>

                    <div class="user">
                        <b>hoanganh</b>
                        <span>user</span>
                    </div>
                </div>

                <button class="logout-btn">
                    ⇥ Đăng xuất
                </button>
            </footer>

        </aside>


        <!-- ================= CONTENT ================= -->
        <div class="content">

            <!-- TOPBAR -->
            <header class="topbar">

                <div>
                    <h1>Data Sensor</h1>
                    <p>Tra cứu và lọc lịch sử dữ liệu cảm biến</p>
                </div>

                <div class="system-online">
                    <span class="status-dot"></span>
                    <span></span>
                </div>

            </header>


            <!-- ================= TABLE PAGE ================= -->
            <main class="table-page">

                <section class="nothing hidden">
                    <img src="asset/image/icons8-nothing-found-100.png" alt="not found" style="display: block; width: 100%;">
                    <label for="">Chưa có dữ liệu cảm biến</label>
                </section>

                <!-- FILTER -->
                <section class="filter-panel sensor-search-panel">
                    <div class="sensor-search-group">
                        <div class="filter-item">
                            <label for="sensorSearch">Tìm kiếm giá trị</label>
                            <input id="sensorSearch" type="search" placeholder="Nhập giá trị tìm kiếm">
                        </div>
                        <div class="filter-item">
                            <label for="sensorSearchType">Tìm kiếm theo</label>
                            <select id="sensorSearchType">
                                <option value="TEMPERATURE">Nhiệt độ</option>
                                <option value="HUMIDITY">Độ ẩm</option>
                                <option value="LIGHT">Ánh sáng</option>
                                <option value="TIME">Thời gian</option>
                            </select>
                        </div>
                        <div class="filter-buttons">
                            <button type="button" class="search-btn">Tìm</button>
                            <button type="button" class="reset-btn">Đặt lại</button>
                        </div>
                    </div>
                </section>


                <!-- TABLE -->
                <section class="data-table-card hidden">

                    <header class="table-header">
                        <h2>Dữ liệu cảm biến</h2>
                        <span>
                            Cập nhật gần nhất:
                            <span id="lastUpdate"></span>
                        </span>
                    </header>


                    <div class="table-content">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Sensor ID</th>
                                    <th>Tên cảm biến</th>
                                    <th>Giá trị</th>
                                    <th>Đơn vị</th>
                                    <th>Thời gian</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>


                    <!-- TABLE FOOTER -->
                    <footer class="table-footer">
                        <label class="record-limit" for="sensorPageSize">
                            Hiển thị:
                            <select id="sensorPageSize" aria-label="Số bản ghi mỗi trang">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                            bản ghi/trang
                        </label>
                        <nav class="pagination" id="pagination"></nav>
                    </footer>
                </section>
            </main>
        </div>
    </div>
</body>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/sensor-data.js"></script>
</html>
